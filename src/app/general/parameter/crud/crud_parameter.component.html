@if (!isLoading) {
<div class="crud-container">
  <div class="crud-header">
    <h2>{{ isEditMode ? 'Editar Parámetro' : 'Nuevo Parámetro' }}</h2>
  </div>

  <form [formGroup]="parameterForm" class="form-content">
    <div class="form-container">
      <!-- Cabecera: Código, Nombre, Global -->
      <div class="form-row">
        <div class="form-group">
          <label>Código *</label>
          <ejs-textbox
            formControlName="code"
            placeholder="Ingrese el código">
          </ejs-textbox>
        </div>
        <div class="form-group">
          <label>Nombre *</label>
          <ejs-textbox
            formControlName="name"
            placeholder="Ingrese el nombre">
          </ejs-textbox>
        </div>
      </div>

      <div class="form-row">
        <div class="checkbox-group">
          <input
            type="checkbox"
            id="isGlobal"
            formControlName="isGlobal">
          <label for="isGlobal">Global</label>
        </div>
      </div>

      <!-- Detalles: Grid Inline -->
      <fieldset class="details-frame">
        <legend>Detalles</legend>

        <ejs-grid
          [dataSource]="details"
          [allowPaging]="true"
          [pageSettings]="{ pageSize: 10 }"
          [toolbar]="['Add', 'Edit', 'Delete', 'Update', 'Cancel']"
          [editSettings]="{ allowEditing: true, allowAdding: true, allowDeleting: true, mode: 'Normal' }"
          (actionBegin)="onDetailActionBegin($event)"
          (actionComplete)="onDetailActionComplete($event)"
        >
          <e-columns>
            <e-column field="code" headerText="Código" width="150"></e-column>
            <e-column field="value" headerText="Valor" width="200"></e-column>
            <e-column field="description" headerText="Descripción" width="300"></e-column>
            <e-column headerText="Acciones" width="120" [commands]="[{ type: 'Edit', buttonOption: { iconCss: 'e-icons e-edit', cssClass: 'e-flat' } }, { type: 'Delete', buttonOption: { iconCss: 'e-icons e-delete', cssClass: 'e-flat' } }, { type: 'Save', buttonOption: { iconCss: 'e-icons e-update', cssClass: 'e-flat' } }, { type: 'Cancel', buttonOption: { iconCss: 'e-icons e-cancel-icon', cssClass: 'e-flat' } }]"></e-column>
          </e-columns>
        </ejs-grid>
      </fieldset>
    </div>
  </form>

  <!-- Botones flotantes -->
  <div class="floating-actions">
    <button type="button" class="btn-cancel" (click)="onCancel()">
      Cancelar
    </button>
    <button type="button" class="btn-select" (click)="onSubmit()">
      {{ isEditMode ? 'Grabar' : 'Guardar' }}
    </button>
  </div>
</div>
} @else {
<div class="loading-spinner">
  <p>Cargando...</p>
</div>
}
