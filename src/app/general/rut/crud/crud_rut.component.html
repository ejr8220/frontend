@if (!isLoading) {
<div class="crud-container">
  <div class="crud-header">
    <h2>{{ isEditMode ? 'Editar Rut' : 'Nuevo Rut' }}</h2>
  </div>

  <form [formGroup]="rutForm" class="form-content">
    <div class="form-container">
      <div class="form-row">
        <div class="form-group">
          <label>RUT *</label>
          <ejs-textbox formControlName="identification" placeholder="Ingrese RUT"></ejs-textbox>
        </div>
        <div class="form-group">
          <label>RUT Original</label>
          <ejs-textbox formControlName="originalIdentification" placeholder="Ingrese RUT original"></ejs-textbox>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Nombre *</label>
          <ejs-textbox formControlName="name" placeholder="Ingrese nombre"></ejs-textbox>
        </div>
        <div class="form-group">
          <label>Saldo</label>
          <ejs-numerictextbox formControlName="balance" format="N2" [decimals]="2" [min]="0"></ejs-numerictextbox>
        </div>
      </div>

      <div class="form-row">
        <div class="checkbox-group">
          <input type="checkbox" id="isActive" formControlName="isActive">
          <label for="isActive">Activo</label>
        </div>
      </div>
    </div>
  </form>

  <div class="floating-actions">
    <button type="button" class="btn-cancel" (click)="onCancel()">Cancelar</button>
    <button type="button" class="btn-select" (click)="onSubmit()">{{ isEditMode ? 'Grabar' : 'Guardar' }}</button>
  </div>
</div>
} @else {
<div class="loading-spinner">
  <p>Cargando...</p>
</div>
}
